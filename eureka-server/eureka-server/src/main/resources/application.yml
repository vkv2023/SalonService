server:
  port: 8070

spring:
  application:
    name: eureka-server
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  instance:
    hostname: localhost
  client:
      register-with-eureka: false
      fetch-registry: false
  service-url:
    defaultZone: "http://${eureka.instance.hostname}:${server.port}/eureka/"

