services:

  # ================================
  # MYSQL DATABASE
  # ================================
  salon_db:
    image: mysql:8.4
    container_name: salon_db
    ports:
      - "3301:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "salon_db"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - backend

  # ================================
  # EUREKA SERVER
  # ================================
  eureka-server:
    image: "vashisthavinod/salon-eureka-server:v0"
    container_name: eureka-server
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - backend

  # ================================
  # GATEWAY SERVER
  # ================================
  gateway-server:
    image: "vashisthavinod/salon-gateway-server:v0"
    container_name: gateway-server
    ports:
      - "5000:5000"
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8070/eureka/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - backend

  # ================================
  # USER SERVICE
  # ================================
  salon-user-service:
    image: "vashisthavinod/salon-user-service:v0"
    container_name: salon-user-service
    ports:
      - "5001:5001"
    depends_on:
      salon_db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "salon-user-service"
#      if you create a single db process for each service use like this
#      SPRING_DATASOURCE_URL: "jdbc:mysql://salon_db:3306/salon_db"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/salon_user_service"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "Calm032@@"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8070/eureka/"
    healthcheck:
      test: ["CMD", "curl --fail --silent  eureka-server:8070/actuator/health/readiness | grep UP | exist 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - backend

  # ================================
  # BOOKING SERVICE
  # ================================
  salon-booking-service:
    image: "vashisthavinod/salon-booking-service:v0"
    container_name: salon-booking-service
    ports:
      - "5005:5005"
    depends_on:
      #      salon_db:
      #        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "salon-booking-service"
      #      SPRING_DATASOURCE_URL: "jdbc:mysql://salon_db:3306/salon_db"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/salon_booking_service"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "Calm032@@"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8070/eureka/"
    healthcheck:
      test: ["CMD", "curl --fail --silent  eureka-server:8070/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - backend

  # ================================
