spring:
  application:
    name: SALON-USER-SERVICE

  datasource:
    url: "jdbc:mysql://localhost:3306/salon_user_service"
    username: "root"
    password: "Calm032@@"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 5001

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"